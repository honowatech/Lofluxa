<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>{% block title %}Tournéo{% endblock %}</title>
<style>
  @page {
    size: {% block page_size %}A4{% endblock %};
    margin: 18mm 14mm 16mm 14mm;
    @bottom-left { content: "Tournéo — {{ company_name | default('OLA Energy Cameroun') }}"; font-size: 8pt; color: #666; }
    @bottom-right { content: "Page " counter(page) " / " counter(pages); font-size: 8pt; color: #666; }
  }
  body { font-family: "DejaVu Sans", "Liberation Sans", Arial, sans-serif; font-size: 9.5pt; color: #1a1a1a; }
  header.doc { display: flex; align-items: center; justify-content: space-between; border-bottom: 2px solid #1a1a1a; padding-bottom: 6px; margin-bottom: 10px; }
  header.doc img { max-height: 40px; }
  header.doc .company { font-size: 13pt; font-weight: 700; }
  header.doc .doc-title { font-size: 12pt; font-weight: 700; text-align: right; }
  header.doc .doc-sub { font-size: 9pt; color: #444; text-align: right; }
  h2 { font-size: 10.5pt; margin: 12px 0 4px; }
  table { width: 100%; border-collapse: collapse; margin: 4px 0 8px; }
  th, td { border: 1px solid #999; padding: 3px 5px; text-align: left; vertical-align: top; }
  th { background: #eee; font-weight: 700; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  .meta { display: flex; flex-wrap: wrap; gap: 4px 24px; margin-bottom: 6px; }
  .meta div span { color: #555; }
  .warn { color: #9a5b00; font-weight: 700; }
  .block { color: #a40000; font-weight: 700; }
  .note { font-size: 8pt; color: #555; margin-top: 6px; }
  .signatures { display: flex; gap: 24px; margin-top: 22px; }
  .signatures div { flex: 1; border-top: 1px solid #333; padding-top: 4px; height: 46px; font-size: 8.5pt; }
  .page-break { page-break-before: always; }
  {% block extra_css %}{% endblock %}
</style>
</head>
<body>
<header class="doc">
  <div>
    {% if logo_url %}<img src="{{ logo_url }}" alt="">{% else %}<div class="company">{{ company_name | default('OLA Energy Cameroun') }}</div>{% endif %}
  </div>
  <div>
    <div class="doc-title">{% block doc_title %}{% endblock %}</div>
    <div class="doc-sub">{% block doc_sub %}{% endblock %}</div>
  </div>
</header>
{% block content %}{% endblock %}
</body>
</html>
