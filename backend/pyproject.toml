[project]
name = "tourneo-backend"
version = "0.1.0"
description = "Tournéo — planification des tournées de livraison carburant (OLA Energy Cameroun)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0.36",
    "psycopg[binary,pool]>=3.2",
    "geoalchemy2>=0.16",
    "shapely>=2.0",
    "alembic>=1.14",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "email-validator>=2.2",
    "ortools>=9.11",
    "httpx>=0.27",
    "celery[redis]>=5.4",
    "redis>=5.2",
    "weasyprint>=63",
    "jinja2>=3.1",
    "openpyxl>=3.1",
    "pandas>=2.2",
    "python-jose[cryptography]>=3.3",
    "passlib[argon2]>=1.7.4",
    "structlog>=24.4",
    "python-multipart>=0.0.17",
    "uuid6>=2024.7.10",
    "slowapi>=0.1.9",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "ruff>=0.8",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
addopts = "-q"
markers = [
    "slow: tests longs (moteur à l'échelle)",
]
filterwarnings = [
    "ignore::DeprecationWarning:passlib.*",
    "ignore::DeprecationWarning:jose.*",
]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008", "UP046", "UP047"]
